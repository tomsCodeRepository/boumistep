services:
  php:
    build: .
    container_name: boumistep_docker
    restart: unless-stopped
    ports:
      - "8097:80"
    environment:
      APP_ENV: prod
      APP_SECRET: ${DOCKER_APP_SECRET:-changeme}
      DATABASE_URL: "mysql://${DB_USER:-app}:${DB_PASSWORD:-changeme}@database:3306/${DB_NAME:-app}?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-app}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-changeme}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-changeme-root}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  database_data:
